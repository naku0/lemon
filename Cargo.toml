[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rustfft = "6"
serialport = { version = "4", default-features = false }
ratatui = "0.29"
crossterm = "0.28"
ctrlc = "3"
clap = { version = "4", features = ["derive"] }
directories = "6"
core_types = { package = "core", path = "crates/core" }
source = { path = "crates/source" }
processing = { path = "crates/processing" }
storage = { path = "crates/storage" }
tui = { path = "crates/tui" }
analysis = { path = "crates/analysis" }
report = { path = "crates/report" }

[workspace.lints.clippy]
unwrap_used = "deny"
